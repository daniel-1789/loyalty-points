# slf4j-simple logging configuration.
#
# Default level is INFO: earns, redemptions, denials, and an HTTP access line are all visible.
# For deeper debugging (per-lot point consumption and balance reads), enable DEBUG for the app
# package -- either uncomment the line at the bottom, or pass:
#   -Dorg.slf4j.simpleLogger.log.com.loyalty=debug

org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# Quiet the embedded server's startup chatter so application logs stand out.
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn

# Uncomment for verbose application logging (per-lot consumption, balance reads):
#org.slf4j.simpleLogger.log.com.loyalty=debug
